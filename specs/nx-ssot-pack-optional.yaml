InfinityLangSpec:
  kind: InfinityLangSpec
  id: INFINITY_LANG
  version: "0.1"
  build: "2025.12.18-INF01"
  builtUtc: "2025-12-18T19:51:05Z"
  author: "Akinori Shiozawa"
  useAllowed: "personal / non-commercial"
  status: "DRAFT"
  purpose:
    - "Object-first command language for NX (commands, navigation, time, ops)."
    - "Reduce ambiguity and prevent SpecDrift by canonical forms."
  canonicalForm:
    commandStyle: "slash-leading"
    pattern: "/<verb> <objectPath> <modifiers...>"
  timeModel:
    note: "Time navigation is treated as navigation of a coordinate, same as position/viewpoint."
    forms: ["/time now", "/time +1m", "/time +1y", "/time year:2045"]

