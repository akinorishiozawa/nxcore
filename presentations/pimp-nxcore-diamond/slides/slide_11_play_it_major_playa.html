<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; overflow: hidden; background: #0a0010; }
    .slide-container { width: 1280px; height: 720px; position: relative; }
    .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .top-banner {
      position: absolute; top: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.97) 0%, rgba(10,0,20,0.92) 100%);
      border-bottom: 3px solid #d4a800;
      padding: 8px 20px 6px; text-align: center; z-index: 10;
    }
    .chain-border { font-size: 14px; color: #d4a800; letter-spacing: 4px; line-height: 1; margin-bottom: 3px; }
    .banner-title {
      font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
      font-size: 28px; color: #fff;
      text-shadow: 0 0 18px #d4a800, 0 0 35px #d4a800;
      letter-spacing: 2px; line-height: 1.1;
    }
    .banner-subtitle {
      font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
      font-size: 20px; color: #d4a800;
      text-shadow: 0 0 12px #d4a800; letter-spacing: 4px;
    }
    .center-title {
      position: absolute; bottom: 80px; left: 0; right: 0;
      text-align: center; z-index: 10;
    }
    .center-title h2 {
      font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
      font-size: 52px; color: #d4a800;
      text-shadow: 0 0 30px #d4a800, 0 0 60px #d4a800, 2px 2px 0 #000;
      letter-spacing: 4px;
    }
    .center-title p {
      font-family: 'Times New Roman', serif;
      font-size: 22px; color: #fff;
      text-shadow: 0 0 15px #d4a800, 1px 1px 0 #000;
      letter-spacing: 3px; margin-top: 8px;
    }
    .diamond-badge {
      position: absolute; bottom: 16px; right: 20px;
      background: linear-gradient(135deg, #1a0a00, #3d2000);
      border: 2px solid #d4a800; border-radius: 6px;
      padding: 6px 12px; text-align: center; z-index: 20;
    }
    .diamond-badge .diamond-icon { font-size: 16px; color: #d4a800; }
    .diamond-badge .badge-text {
      font-family: 'Times New Roman', serif;
      font-size: 11px; color: #d4a800;
      font-style: italic; display: block; line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="bg-image" src="/home/ubuntu/nxcore_pimp_presentation_diamond/bg_slide_5.webp" alt="Play It Major, Playa" />
    <div class="top-banner">
      <div class="chain-border">◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆</div>
      <div class="banner-title">Personal Intelligence Meta-Processor</div>
      <div class="banner-subtitle">P.I.M.P. nxcore</div>
      <div class="chain-border">◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆</div>
    </div>
    <div class="center-title">
      <h2>Play It Major, Playa</h2>
      <p>P.I.M.P. nxcore — Your Cognitive Operating System</p>
    </div>
    <div class="diamond-badge">
      <span class="diamond-icon">♦</span>
      <span class="badge-text">Diamond</span>
      <span class="badge-text">Edition</span>
    </div>
  </div>
</body>
</html>
