<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; overflow: hidden; background: #0a0010; }
    .slide-container { width: 1280px; height: 720px; position: relative; }

    /* Full background image */
    .bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* Top gothic banner */
    .top-banner {
      position: absolute; top: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.97) 0%, rgba(10,0,20,0.92) 100%);
      border-bottom: 3px solid #d4a800;
      padding: 10px 20px 8px;
      text-align: center;
      z-index: 10;
    }
    .chain-border {
      font-size: 18px; color: #d4a800; letter-spacing: 6px;
      line-height: 1; margin-bottom: 4px;
    }
    .banner-title {
      font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
      font-size: 32px; color: #fff;
      text-shadow: 0 0 20px #d4a800, 0 0 40px #d4a800;
      letter-spacing: 2px; line-height: 1.1;
    }
    .banner-subtitle {
      font-family: 'UnifrakturMaguntia', 'Times New Roman', serif;
      font-size: 22px; color: #d4a800;
      text-shadow: 0 0 15px #d4a800;
      letter-spacing: 4px;
    }

    /* Diamond Edition badge */
    .diamond-badge {
      position: absolute; bottom: 16px; right: 20px;
      background: linear-gradient(135deg, #1a0a00, #3d2000);
      border: 2px solid #d4a800;
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      z-index: 20;
    }
    .diamond-badge .diamond-icon { font-size: 20px; color: #d4a800; }
    .diamond-badge .badge-text {
      font-family: 'Times New Roman', serif;
      font-size: 13px; color: #d4a800;
      font-style: italic; display: block;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="bg-image" src="/home/ubuntu/nxcore_pimp_presentation_diamond/bg_slide_1.webp" alt="P.I.M.P. nxcore Title" />

    <div class="top-banner">
      <div class="chain-border">◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆</div>
      <div class="banner-title">Personal Intelligence Meta-Processor</div>
      <div class="banner-subtitle">P.I.M.P. nxcore</div>
      <div class="chain-border">◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆ ◈ ◆</div>
    </div>

    <div class="diamond-badge">
      <span class="diamond-icon">♦</span>
      <span class="badge-text">Diamond</span>
      <span class="badge-text">Edition</span>
    </div>
  </div>
</body>
</html>
