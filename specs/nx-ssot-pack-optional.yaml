NxAtomSpec:
  kind: NxAtomSpec
  id: NX_ATOM_SPEC
  version: "1.0"
  build: "2025.12.18-ATOM10"
  builtUtc: "2025-12-18T19:51:05Z"
  author: "Akinori Shiozawa"
  useAllowed: "personal / non-commercial"
  definition:
    classes:
      NxAtom:
        fields: [id, name, version, role, layer, inputs, outputs, constraints, methods, ioContract]
        layerEnum: ["world", "os", "ops", "game"]
      Slot:
        fields: [name, type, required, desc]
        typeEnum: ["text", "json", "eventLog", "snapshot", "mediaRef"]
      IoContract:
        fields: [inputSchema, outputSchema, validators]
      AtomRunResult:
        fields: [artifacts, events, notes]

NxAtomRegistry:
  kind: NxAtomRegistry
  id: NX_ATOM_REGISTRY
  version: "1.2"
  build: "2025.12.18-AR12"
  builtUtc: "2025-12-18T19:51:05Z"
  author: "Akinori Shiozawa"
  useAllowed: "personal / non-commercial"
  atoms:
    - id: "ATOM_ARC_MINER"
      name: "ARC_MiningAtom"
      version: "0.1"
      role: "Mine pasted logs/specs and extract ONLY reusable assets (candidates)."
      layer: "ops"
      inputs:
        - { name: "corpus", type: "text", required: true, desc: "Pasted logs/spec blocks (e.g., NX_LOG_EXPORT)." }
        - { name: "mode", type: "text", required: false, desc: "general | cm | history" }
      outputs:
        - { name: "artifacts", type: "json", required: true, desc: "Reusable candidate assets." }
        - { name: "events", type: "eventLog", required: true, desc: "Append-only event entries." }
      constraints: ["evidenceOnly", "noAutoFinalize"]
      methods: ["invoke", "validate", "emitEvents"]
      ioContract:
        inputSchema: "corpus(text), mode(optional)"
        outputSchema: "artifacts(list), events(list), notes(optional)"
        validators: ["evidenceFirst", "noPlaceholderLeak"]
    - id: "ATOM_NX_LOG_EXPORTER"
      name: "NX_LogExporter"
      version: "0.1"
      role: "Compress a full chat into NX_LOG_EXPORT v0.1 format."
      layer: "ops"
      inputs:
        - { name: "chatTranscript", type: "text", required: true, desc: "Raw conversation transcript." }
      outputs:
        - { name: "export", type: "text", required: true, desc: "NX_LOG_EXPORT formatted block." }
        - { name: "events", type: "eventLog", required: false, desc: "Exporter run notes." }
      constraints: ["evidenceOnly"]
      methods: ["invoke", "validate"]
      ioContract:
        inputSchema: "chatTranscript(text)"
        outputSchema: "export(text)"
        validators: ["noSystemPromptLeak"]
    - id: "ATOM_OPS_AUDITOR"
      name: "OpsAuditAtom"
      version: "0.1"
      role: "Periodic config-management audit: detect drift and emit PatchQueue."
      layer: "ops"
      status: "DRAFT"
      inputs:
        - { name: "ssotSnapshot", type: "snapshot", required: true, desc: "Current SSOT pack text." }
      outputs:
        - { name: "auditReport", type: "json", required: true, desc: "Findings with evidence pointers." }
        - { name: "patchQueue", type: "json", required: true, desc: "Patch candidates (not applied diffs)." }
      constraints: ["evidenceFirst", "failFastOnPlaceholder"]
      methods: ["invoke", "validate", "emitEvents"]
      ioContract:
        inputSchema: "ssotSnapshot(snapshot)"
        outputSchema: "auditReport(json), patchQueue(json)"
        validators: ["evidenceFirst", "noPlaceholderLeak", "commandCanonical"]

NxLogExportSpec:
  kind: NxLogExportSpec
  id: NX_LOG_EXPORT
  version: "0.1"
  build: "2025.12.18-LEX01"
  builtUtc: "2025-12-18T19:51:05Z"
  author: "Akinori Shiozawa"
  useAllowed: "personal / non-commercial"
  template:
    note: "Use this exact structure for mining-ready exports."
    format: |
      [NX_LOG_EXPORT v0.1]
        1. CHAT_TITLE
        - <title>

        2. MAIN_TOPICS
        - <bullet 1>
        - <bullet 2>
        - <bullet 3>

        3. TIMELINE (max 20 bullets)
        - [1] <event>
        - [2] <event>
        ...

        4. IMPORTANT_SNIPPETS (max 10 blocks)
        - [BLOCK 1 TYPE: SPEC / COMMAND / AGENT / MODEL]
        """
        <verbatim snippet>
        """
        ...

        5. NOTES_FOR_MINING
        - <reusable notes>

NoBaselineInspectorSpec:
  kind: NoBaselineInspectorSpec
  id: XLLM_INSPECTOR_NOBASELINE
  version: "1.0"
  build: "2025.12.18-NB10"
  builtUtc: "2025-12-18T19:51:05Z"
  author: "Akinori Shiozawa"
  useAllowed: "personal / non-commercial"
  rule:
    when:
      - "MAIN_SESSION_SPEC missing"
      - "OR CURRENT_SESSION_SPEC missing"
    then:
      - "Do NOT guess or fabricate either spec."
      - "Emit SESSION_SPEC_REPORT with a single T00 row"
      - "Emit MERGED_SPEC status=INCOMPLETE"
      - "Emit MAIN_DEPLOYMENT_ARTIFACT with NOT_RUN summaries"
    note: "Prevents hallucinated diffs when baselines are absent."

